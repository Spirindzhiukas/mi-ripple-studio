# Builds the Windows installer on a Windows runner — no local toolchain needed.
#
#   1. Push this repository to GitHub.
#   2. Actions tab -> "Build Windows installer" -> "Run workflow"
#      (it also runs automatically on push to main/master).
#   3. When the job finishes, download the "Mi-Ripple-Studio-Windows-x64"
#      artifact — that .exe is the finished NSIS installer.
#
# The built app is fully offline: no Python, Node, or network needed to RUN it.

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller

      - name: Freeze Gradio backend (PyInstaller)
        run: |
          pyinstaller build/server.spec --clean --noconfirm
          Move-Item dist python-dist
          Remove-Item -Recurse -Force build/server -ErrorAction SilentlyContinue
          if (-not (Test-Path "python-dist/MiRippleServer/MiRippleServer.exe")) {
            throw "PyInstaller output missing — check build/server.spec"
          }

      - name: Clean stale example files
        run: |
          Remove-Item examples/index.json -ErrorAction SilentlyContinue
          Remove-Item examples/generated_*.png -ErrorAction SilentlyContinue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Electron + package installer
        run: |
          cd electron
          npm ci --no-audit --no-fund
          npx electron-builder --win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Ripple-Studio-Windows-x64
          path: electron/dist/Mi-Ripple Studio-*-win-x64.exe
          retention-days: 30
